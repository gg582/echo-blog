# echo-blog (https://github.com/gg582/echo-blog)
#
# Usage:
#   docker compose up -d --build
#   docker compose exec echo-blog echo-blog init   # create the admin account (interactive)
#
# Data (posts, uploaded assets, about/contact, auth.db) lives in the named
# volume below. On first start it is seeded from the image; afterwards it
# persists independently of the image, so rebuilding never loses content.

services:
  echo-blog:
    build: .
    image: echo-blog:latest
    container_name: echo-blog
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDR: ":8080"
      STATIC_DIR: /app/blog-frontend/build
      # Set a persistent secret or login tokens are invalidated on every restart:
      # AUTH_SECRET: "change-me"
      # Only needed when the frontend is served from another origin:
      # ALLOWED_ORIGINS: "https://chatter.pw,http://localhost:3000"
      # TLS is expected to be terminated by a reverse proxy; keep USE_HTTPS unset.
    volumes:
      # The volume keeps its original name so existing content stays attached.
      - chi-blog-data:/app/blog-backend
    restart: unless-stopped

volumes:
  chi-blog-data:
